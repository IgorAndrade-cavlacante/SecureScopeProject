<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Rate.css">
    <link rel="stylesheet" href="/site-header.css">
    <script type="module" src="Rate.js"></script>
    <link rel="icon" href="/images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Feedback</title>
  <script src="/site-search.js" defer></script>
</head>
<body>
    <header class="header site-header">
      <a class="logo" href="/home" aria-label="Página inicial do SecureScope">
        <img src="/images/logotipo.png" alt="Logo SecureScope">
      </a>

      <nav class="navbar" aria-label="Navegação principal">
        <a href="/home">Home</a>
        <a href="/painel">Services</a>
        <a href="#">Solutions</a>
        <a href="/about">About Us</a>
        <a href="/rate/Rate.html" class="rate active" aria-current="page">Rate us</a>
      </nav>

    <!-- SEARCH -->
    <div class="search" role="search">

      <input
        type="text"
        class="search-input"
        aria-label="Pesquisar nesta página"
        placeholder="Pesquisar...">

      <button type="button" class="search-btn" aria-label="Pesquisar nesta página">
        <img
          src="/images/lupa.png"
          alt="Pesquisar"
          width="20"
          height="20">
      </button>
    </div>
    </header>

    <main class="rate-main">
    <div class="card">
        <div class="estrela">
            <img src="/images/icon-star.svg" alt="icone de uma estrela laranja">
        </div>

        <h1> Sua opinião é muito importante!</h1>
        <p> Queremos oferecer a melhor experiência possível para você. 
    Seu feedback nos ajuda a melhorar nossos serviços, corrigir problemas 
    e criar soluções cada vez melhores para todos os usuários.</p>

        <div class="botoes">
            <button type="button" aria-label="Avaliar com 1 de 5" aria-pressed="false">1</button>
            <button type="button" aria-label="Avaliar com 2 de 5" aria-pressed="false">2</button>
            <button type="button" aria-label="Avaliar com 3 de 5" aria-pressed="false">3</button>
            <button type="button" aria-label="Avaliar com 4 de 5" aria-pressed="false">4</button>
            <button type="button" aria-label="Avaliar com 5 de 5" aria-pressed="false">5</button>
        </div>

        <a id="enviar-feedback" href="/rate/pages/agradecimento.html">Enviar</a>
    </div>
    </main>


</body>
</html>
