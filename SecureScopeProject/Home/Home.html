<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SecureScope — Segurança Digital Inteligente</title>
  <meta name="description" content="SecureScope: plataforma de governança de risco com IA para proteção proativa do seu ambiente digital.">

  <!-- FAVICON -->
  <link rel="icon" href="/images/favicon-32x32.png">

  <!-- CSS -->
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="/site-header.css">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@500;700;800&family=VT323&display=swap"
    rel="stylesheet">
  <script src="/site-search.js" defer></script>
</head>

<body>

  <!-- HEADER -->
  <header class="header site-header">

    <!-- LOGO -->
    <a class="logo" href="/home" aria-label="Página inicial do SecureScope">
      <img src="/images/logotipo.png" alt="Logo SecureScope">
    </a>

    <!-- NAVBAR -->
    <nav class="navbar" aria-label="Navegação principal">
      <a href="/home" class="active" aria-current="page">Home</a>
      <a href="/painel">Services</a>
      <a href="#">Solutions</a>
      <a href="/about">About Us</a>
      <a href="/rate/Rate.html" class="rate">Rate us</a>
    </nav>

    <!-- SEARCH -->
    <div class="search" role="search">

      <input
        type="text"
        class="search-input"
        aria-label="Pesquisar nesta página"
        placeholder="Pesquisar...">

      <button type="button" class="search-btn" aria-label="Pesquisar nesta página">
        <img
          src="/images/lupa.png"
          alt="Pesquisar"
          width="20"
          height="20">
      </button>

    </div>

  </header>

  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="hero">

      <div class="hero-text">

        <h1>
          Segurança Digital
          <strong>INTELIGENTE</strong>
          <strong>E PROATIVA</strong>
        </h1>

        <p>
          Proteja o que importa
        </p>

        <!-- BUTTONS -->
        <div class="hero-buttons">

          <a href="/painel?auth=registro" class="btn btn-secondary">
            Criar Conta
          </a>

          <a href="/painel?auth=login" class="btn btn-primary">
            Login
          </a>

        </div>

      </div>

    </section>

  </main>

</body>

</html>
